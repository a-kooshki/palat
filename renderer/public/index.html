<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Stone Inventory Management System">
  <title>Stone Inventory Management</title>
  <link rel="icon" href="icon.png" type="image/png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background-color: #1a1a1a;
      color: #ffffff;
      min-height: 100vh;
    }
    
    #root {
      min-height: 100vh;
    }
    
    /* Loading spinner */
    .loading-spinner {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #1a1a1a;
    }
    
    .spinner {
      width: 50px;
      height: 50px;
      border: 5px solid #3b82f6;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    /* RTL support for Persian */
    [dir="rtl"] {
      direction: rtl;
      text-align: right;
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="loading-spinner">
      <div class="spinner"></div>
    </div>
  </div>
  
  <!-- Load React scripts -->
  <script>
    // Check if we're in Electron or browser
    if (window.electronAPI) {
      // We're in Electron, scripts will be loaded by the main process
    } else {
      // We're in browser for development
      document.write('<script src="http://localhost:3000/static/js/bundle.js"><\/script>');
    }
  </script>
</body>
</html>
